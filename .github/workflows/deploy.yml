name: Deploy dashboard to Pages

# The jal-bot run pushes a fresh index.html to gh-pages daily; this deploys it.
# Replaces the legacy Jekyll Pages builder (retired / unreliable) with a plain
# static-artifact upload. .nojekyll in the repo root keeps the files verbatim.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let each daily push finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
